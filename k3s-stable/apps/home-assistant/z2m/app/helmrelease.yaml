---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: z2m
  namespace: home-assistant
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: zigbee2mqtt
      version: 2.14.2
      sourceRef:
        kind: HelmRepository
        name: z2m
        namespace: flux-system
  install:
    remediation:
      retries: 5
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    image:
      repository: koenkk/zigbee2mqtt
      tag: 2.14.3@sha256:fb4a6b0f6868ad1cd6a9996479802b2420e599c3463b62bbff8c8cd9a908f43a
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - host: "zigbee2mqtt.${HOMELAB_DOMAIN}"
          paths:
            - path: /
              pathType: ImplementationSpecific
            - path: /api
              pathType: ImplementationSpecific
      tls:
        - hosts:
          - "zigbee2mqtt.${HOMELAB_DOMAIN}"
      annotations:
        external-dns.alpha.kubernetes.io/hostname: "zigbee2mqtt.${HOMELAB_DOMAIN}"
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Zigbee2MQTT Home"
        gethomepage.dev/group: "Automations"
        gethomepage.dev/icon: "zigbee2mqtt"
    statefulset:
      storage:
        enabled: true
        storageClassName: nfs-ssd
    zigbee2mqtt:
      mqtt:
        server: "mqtt://mosquitto.home-assistant.svc.cluster.local:8883"
        base_topic: zigbee2mqtt_home
      serial:
        port: "/dev/ttyUSB0"
        adapter: "ezsp"
