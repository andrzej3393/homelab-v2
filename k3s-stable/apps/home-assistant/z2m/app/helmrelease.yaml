---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: z2m
  namespace: home-assistant
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: zigbee2mqtt
      version: 2.13.0
      sourceRef:
        kind: HelmRepository
        name: z2m
        namespace: flux-system
  install:
    remediation:
      retries: 5
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    image:
      repository: koenkk/zigbee2mqtt
      tag: 2.14.0@sha256:c13d177dd7f7f396574ab00926188ad542cfb68c6a5d5f84021bebd9adf6ede9
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - host: "zigbee2mqtt.${HOMELAB_DOMAIN}"
          paths:
            - path: /
              pathType: ImplementationSpecific
            - path: /api
              pathType: ImplementationSpecific
      tls:
        - hosts:
          - "zigbee2mqtt.${HOMELAB_DOMAIN}"
      annotations:
        external-dns.alpha.kubernetes.io/hostname: "zigbee2mqtt.${HOMELAB_DOMAIN}"
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Zigbee2MQTT Home"
        gethomepage.dev/group: "Automations"
        gethomepage.dev/icon: "zigbee2mqtt"
    statefulset:
      storage:
        enabled: true
        storageClassName: nfs-ssd
    zigbee2mqtt:
      mqtt:
        server: "mqtt://mosquitto.home-assistant.svc.cluster.local:8883"
        base_topic: zigbee2mqtt_home
      serial:
        port: "/dev/ttyUSB0"
        adapter: "ezsp"
