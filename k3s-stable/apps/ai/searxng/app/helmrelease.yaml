apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: searxng
  namespace: ai
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: searxng
      version: "1.1.4"
      sourceRef:
        kind: HelmRepository
        name: searxng
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 5
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 5
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Ingress
              name: searxng-searxng
            patch: |-
              - op: replace
                path: /metadata/name
                value: searxng
  values:
    config:
      settings:
        data: |-
          use_default_settings: true
          server:
            secret_key: pleasechangeme
            limiter: false
            image_proxy: true
            port: 8080
            bind_address: "0.0.0.0"
            base_url: "https://searxng.${HOMELAB_DOMAIN}"
          ui:
            static_use_hash: true
          search:
            autocomplete: ""
            formats:
              - html
              - json
    ingress:
      enabled: true
      className: nginx
      annotations:
        external-dns.alpha.kubernetes.io/hostname: "searxng.${HOMELAB_DOMAIN}"
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "SearxNG"
        gethomepage.dev/group: "AI"
        gethomepage.dev/icon: "searxng"
      hosts:
        - host: "searxng.${HOMELAB_DOMAIN}"
          paths:
            - path: /
              pathType: Prefix
