apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pve-exporter
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: prometheus-pve-exporter
      version: "2.8.0"
      sourceRef:
        kind: HelmRepository
        name: christianknell
        namespace: flux-system
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    image:
      repository: prompve/prometheus-pve-exporter
      tag: 3.9.0@sha256:78a58df7a31c9fbee94962cd06422672668529de6421892df9aed4b6cee0757f
    env:
      pveAuthType: password
      pveUser: prometheus@pve
      pveExistingSecretName: pve-exporter
      pveVerifySsl: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
      interval: 30s
      metricRelabelings:
        - sourceLabels: [__address__]
          targetLabel: __param_target
        - sourceLabels: [__param_target]
          targetLabel: instance
        - targetLabel: __address__
          replacement: pve-exporter-prometheus-pve-exporter:80
      pveTargets:
        - "novigrad.${HOMELAB_DOMAIN}."
        - "vengerberg.${HOMELAB_DOMAIN}."
        - "oxenfurt.${HOMELAB_DOMAIN}."
        - "rivia.${HOMELAB_DOMAIN}."
        - "cintra.${HOMELAB_DOMAIN}."
