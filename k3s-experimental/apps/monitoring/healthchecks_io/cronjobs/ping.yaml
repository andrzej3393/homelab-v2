apiVersion: batch/v1
kind: CronJob
metadata:
  name: ping-healthchecks-io
  namespace: monitoring
spec:
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: ping-healthchecks-io
              image: quay.io/curl/curl:8.19.0@sha256:c03110c736db81bbe1be0296f1f1608c81b954b01626bdfb0a8f84e5bd00ff3c
              imagePullPolicy: Always
              args:
                - "-fsS"
                - "-m"
                - "10"
                - "--retry"
                - "5"
                - "https://hc-ping.com/${HC_K8S_CHECK_UUID}"
          restartPolicy: OnFailure
